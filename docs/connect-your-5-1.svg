<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1272" viewBox="0 0 740 1272" role="img" aria-labelledby="foi-wiring-title foi-wiring-desc">
  <title id="foi-wiring-title">Connect a Mac to a 5.1 soundbar through an HDMI audio extractor</title>
  <desc id="foi-wiring-desc">Connect the Mac's built-in HDMI output, or a Thunderbolt or USB-C to HDMI adapter, to the extractor's HDMI IN. Power the illustrated extractor through its USB-C socket labeled DC 5V/1A. Set its three-position TV, 2.0CH, 5.1CH switch to 5.1CH. On the other side of the same extractor, set ARC to OFF. Connect SPDIF OUT to the soundbar's OPTICAL IN with a TOSLINK optical cable, then select the soundbar's optical input. The soundbar must decode Dolby Digital AC-3 over optical. HDMI OUT may optionally connect to a display. The analog AUDIO OUT socket is unused. Port shapes and positions are simplified; follow the printed labels on your own extractor.</desc>
  <defs>
    <marker id="hdmi-arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3b73b1"/>
    </marker>
    <marker id="optical-arrow" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#168068"/>
    </marker>
    <pattern id="speaker-grille" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.25" fill="#58736b"/>
    </pattern>
  </defs>

  <rect width="740" height="1272" rx="24" fill="#f8f9f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#193b38">
    <text x="32" y="48" font-size="18" font-weight="700" letter-spacing="2">FOI SURROUND MONITOR</text>
    <text x="32" y="94" font-size="36" font-weight="700">Connect your 5.1 speakers.</text>
    <text x="32" y="125" font-size="22" fill="#536b65">Mac → HDMI extractor → optical → soundbar</text>

    <!-- Source: either built-in HDMI or a video-capable USB-C adapter. -->
    <rect x="32" y="153" width="676" height="145" rx="22" fill="#ffffff" stroke="#d8e3dc" stroke-width="2"/>
    <circle cx="67" cy="190" r="18" fill="#193b38"/>
    <text x="67" y="197" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">1</text>
    <text x="102" y="198" font-size="28" font-weight="700">Mac</text>
    <text x="64" y="238" font-size="23" font-weight="600">Built-in HDMI</text>
    <text x="64" y="271" font-size="21" fill="#536b65">or Thunderbolt / USB-C → HDMI adapter</text>
    <path d="M536 259 H604 V275 L594 284 H546 L536 275 Z" fill="#193b38"/>
    <path d="M547 266 H593" stroke="#cce2d6" stroke-width="4" stroke-linecap="round"/>

    <!-- Power is a separate connection, not part of the audio route. -->
    <rect x="32" y="330" width="269" height="54" rx="14" fill="#fff4df" stroke="#e4c89a" stroke-width="1.5"/>
    <text x="166" y="364" text-anchor="middle" font-size="21" font-weight="600" fill="#805313">USB power · 5 V / 1 A</text>

    <!-- Both panels below belong to one extractor; port order follows the reference unit. -->
    <rect x="32" y="400" width="676" height="420" rx="22" fill="#ffffff" stroke="#d8e3dc" stroke-width="2"/>
    <circle cx="67" cy="433" r="18" fill="#193b38"/>
    <text x="67" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">2</text>
    <text x="102" y="442" font-size="28" font-weight="700">HDMI audio extractor</text>
    <text x="85" y="480" font-size="18" font-weight="600" letter-spacing="1" fill="#536b65">INPUT SIDE</text>
    <rect x="64" y="494" width="612" height="88" rx="17" fill="#193b38"/>

    <!-- DC socket: USB-C, not an audio or barrel-power jack. -->
    <rect x="120" y="509" width="60" height="23" rx="11.5" fill="#101f20" stroke="#d6e6dc" stroke-width="2"/>
    <path d="M130 521 H170" stroke="#6d8b7f" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="560" text-anchor="middle" font-size="20" font-weight="600" fill="#f0f7f2">DC 5V / 1A</text>
    <path d="M44 384 V488 Q44 500 56 500 H138 Q150 500 150 509" fill="none" stroke="#ad781d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Three real selector positions, with the right-hand 5.1CH position selected. -->
    <rect x="273" y="508" width="169" height="22" rx="8" fill="#101f20" stroke="#7b9a8d" stroke-width="1.5"/>
    <path d="M291 519 H423" stroke="#6c8d7e" stroke-width="3"/>
    <rect x="403" y="504" width="34" height="30" rx="5" fill="#c5ecdb" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M414 511 V527 M422 511 V527" stroke="#3e6b5d" stroke-width="2"/>
    <text x="287" y="560" text-anchor="middle" font-size="18" fill="#c6d8ce">TV</text>
    <text x="349" y="560" text-anchor="middle" font-size="18" fill="#c6d8ce">2.0CH</text>
    <rect x="389" y="541" width="77" height="29" rx="7" fill="#c5ecdb"/>
    <text x="427" y="561" text-anchor="middle" font-size="19" font-weight="700">5.1CH</text>

    <path d="M536 508 H604 V524 L594 533 H546 L536 524 Z" fill="#101f20" stroke="#d6e6dc" stroke-width="2"/>
    <path d="M547 515 H593" stroke="#6d8b7f" stroke-width="4" stroke-linecap="round"/>
    <text x="570" y="560" text-anchor="middle" font-size="21" font-weight="600" fill="#f0f7f2">HDMI IN</text>
    <path d="M570 284 V504" fill="none" stroke="#3b73b1" stroke-width="6" stroke-linecap="round" marker-end="url(#hdmi-arrow)"/>
    <rect x="469" y="334" width="202" height="38" rx="12" fill="#eaf1fb"/>
    <text x="570" y="360" text-anchor="middle" font-size="21" font-weight="600" fill="#285c96">HDMI cable</text>
    <text x="370" y="615" text-anchor="middle" font-size="22" font-weight="600" fill="#168068">Set the switch to 5.1CH</text>

    <text x="85" y="651" font-size="18" font-weight="600" letter-spacing="1" fill="#536b65">OUTPUT SIDE · SAME BOX</text>
    <rect x="64" y="669" width="612" height="98" rx="17" fill="#193b38"/>
    <text x="143" y="694" text-anchor="middle" font-size="18" font-weight="600" fill="#f0f7f2">HDMI OUT</text>
    <path d="M107 708 H179 V725 L168 735 H118 L107 725 Z" fill="#101f20" stroke="#8ba99b" stroke-width="2"/>
    <path d="M120 716 H166" stroke="#6d8b7f" stroke-width="4" stroke-linecap="round"/>

    <text x="310" y="694" text-anchor="middle" font-size="20" font-weight="700" fill="#c5ecdb">SPDIF OUT</text>
    <path d="M288 705 H332 V747 H288 Z" fill="#101f20" stroke="#c5ecdb" stroke-width="2.5"/>
    <path d="M297 714 H323 V733 L318 738 H302 L297 733 Z" fill="#567e70"/>
    <rect x="302" y="719" width="16" height="15" rx="2" fill="#c5ecdb"/>

    <!-- Unused analog output is included to distinguish it from optical. -->
    <text x="453" y="694" text-anchor="middle" font-size="16" fill="#b9cec2">AUDIO OUT</text>
    <circle cx="453" cy="722" r="13" fill="#101f20" stroke="#a78d57" stroke-width="3"/>

    <!-- This button's state is explicit; no assumed physical up/down orientation. -->
    <text x="589" y="694" text-anchor="middle" font-size="20" font-weight="600" fill="#f0f7f2">ARC</text>
    <circle cx="589" cy="719" r="11" fill="#101f20" stroke="#91afa1" stroke-width="2"/>
    <rect x="550" y="737" width="47" height="24" rx="6" fill="#c5ecdb"/>
    <text x="574" y="755" text-anchor="middle" font-size="17" font-weight="700">OFF</text>
    <text x="619" y="755" text-anchor="middle" font-size="17" fill="#b9cec2">ON</text>
    <text x="589" y="800" text-anchor="middle" font-size="21" font-weight="600" fill="#168068">ARC OFF</text>

    <!-- Optional display branch is deliberately subordinate to the optical route. -->
    <path d="M143 736 V840" fill="none" stroke="#9cb2a7" stroke-width="3" stroke-dasharray="5 7"/>
    <rect x="32" y="838" width="230" height="62" rx="13" fill="#eef2ed"/>
    <text x="147" y="864" text-anchor="middle" font-size="19" fill="#536b65">HDMI OUT → display</text>
    <text x="147" y="888" text-anchor="middle" font-size="18" fill="#536b65">Optional</text>

    <!-- The only soundbar connection in this route is TOSLINK optical. -->
    <rect x="32" y="936" width="676" height="244" rx="22" fill="#ffffff" stroke="#d8e3dc" stroke-width="2"/>
    <path d="M310 734 V995" fill="none" stroke="#168068" stroke-width="6" stroke-linecap="round" marker-end="url(#optical-arrow)"/>
    <text x="342" y="857" font-size="24" font-weight="700" fill="#168068">Optical cable</text>
    <text x="342" y="888" font-size="21" fill="#536b65">SPDIF / TOSLINK</text>
    <text x="342" y="983" font-size="21" font-weight="700">OPTICAL IN</text>
    <path d="M334 987 L322 1002" fill="none" stroke="#7d988b" stroke-width="2"/>
    <rect x="84" y="1000" width="572" height="69" rx="27" fill="#193b38"/>
    <rect x="97" y="1011" width="546" height="47" rx="19" fill="url(#speaker-grille)"/>
    <rect x="293" y="997" width="34" height="22" rx="3" fill="#101f20" stroke="#c5ecdb" stroke-width="2"/>
    <rect x="301" y="1002" width="18" height="12" rx="2" fill="#c5ecdb"/>
    <circle cx="67" cy="1122" r="18" fill="#193b38"/>
    <text x="67" y="1129" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">3</text>
    <text x="102" y="1131" font-size="28" font-weight="700">Compatible 5.1 soundbar</text>
    <text x="102" y="1163" font-size="22" fill="#536b65">Select its optical input.</text>

    <text x="32" y="1221" font-size="21" font-weight="600">Needs Dolby Digital (AC-3) decoding over optical.</text>
    <text x="32" y="1251" font-size="18" fill="#536b65">Simplified ports. Follow the labels on your own extractor.</text>
  </g>
</svg>
